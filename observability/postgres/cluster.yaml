apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: observability
spec:
  instances: 1
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  affinity:
    nodeSelector:
      role: observability
    tolerations:
      - key: dedicated
        operator: Equal
        value: observability
        effect: NoSchedule